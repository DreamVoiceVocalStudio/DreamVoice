<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamVoice Vocal Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .landing-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in;
        }

        .landing-container h1 {
            font-size: 4rem;
            color: #f5f1ed;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .landing-container .line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, #c8a882 0%, #8b6f47 50%, #c8a882 100%);
            margin: 20px auto;
            box-shadow: 0 0 15px rgba(200, 168, 130, 0.5);
        }

        .landing-container .subtitle {
            font-size: 1.5rem;
            color: #d4ccc2;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 50px;
            background: linear-gradient(135deg, #8b6f47 0%, #c8a882 100%);
            color: #f5f1ed;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(200, 168, 130, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(200, 168, 130, 0.5);
            background: linear-gradient(135deg, #c8a882 0%, #8b6f47 100%);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 80px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .feature {
            background: rgba(61, 42, 35, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 15px;
            border: 1px solid rgba(200, 168, 130, 0.2);
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(61, 42, 35, 0.8);
            border-color: rgba(200, 168, 130, 0.5);
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .feature h3 {
            color: #c8a882;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .feature p {
            color: #d4ccc2;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .landing-container h1 {
                font-size: 2.5rem;
            }

            .landing-container .subtitle {
                font-size: 1.1rem;
            }

            .cta-button {
                padding: 12px 40px;
                font-size: 1rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 60px;
            }
        }
    </style>
</head>
<body>
    <main class="landing-page">
        <div class="landing-container">
            <h1>DREAMVOICE</h1>
            <div class="line"></div>
            <p class="subtitle">Vocal Studio</p>

            <a href="booking.html" class="cta-button">Перейти до запису</a>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🎤</div>
                    <h3>Професійні уроки</h3>
                    <p>Навчання вокалу від досвідченого педагога</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">📅</div>
                    <h3>Зручне розписання</h3>
                    <p>Обирай дату та час, зручний для тебе</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">✨</div>
                    <h3>Розвиток таланту</h3>
                    <p>Розкрий свій потенціал разом з DreamVoice!</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
