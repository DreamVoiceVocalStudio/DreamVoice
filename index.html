<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamVoice Vocal Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .landing-container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 1s ease-in;
            max-width: 900px;
        }

        .landing-container h1 {
            font-size: 4rem;
            color: #f5f1ed;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 5px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .landing-container .line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b88d75, transparent);
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(184, 141, 117, 0.3);
        }

        .landing-container .subtitle {
            font-size: 1.5rem;
            color: #d4b5a0;
            margin-bottom: 50px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 50px;
            background: linear-gradient(135deg, #b88d75 0%, #9d7762 100%);
            color: #f5f1ed;
            text-decoration: none;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(184, 141, 117, 0.3);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(184, 141, 117, 0.4);
            background: linear-gradient(135deg, #9d7762 0%, #7a5c50 100%);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            margin-top: 80px;
        }

        .feature {
            background: rgba(50, 33, 28, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(184, 141, 117, 0.15);
            transition: all 0.3s ease;
        }

        .feature:hover {
            background: rgba(50, 33, 28, 0.9);
            border-color: rgba(184, 141, 117, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(184, 141, 117, 0.2);
        }

        .feature-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        .feature h3 {
            color: #b88d75;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .feature p {
            color: #d4b5a0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @media (max-width: 768px) {
            .landing-container h1 {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }

            .landing-container .subtitle {
                font-size: 1.1rem;
                margin-bottom: 40px;
            }

            .cta-button {
                padding: 12px 40px;
                font-size: 1rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 60px;
            }

            .feature {
                padding: 25px 18px;
            }
        }

        @media (max-width: 480px) {
            .landing-container h1 {
                font-size: 2rem;
            }

            .landing-container .subtitle {
                font-size: 0.9rem;
                margin-bottom: 30px;
            }

            .cta-button {
                padding: 12px 35px;
                font-size: 0.95rem;
            }

            .feature-icon {
                font-size: 2rem;
            }

            .feature h3 {
                font-size: 1rem;
            }

            .feature p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <main class="landing-page">
        <div class="landing-container">
            <h1>DREAMVOICE</h1>
            <div class="line"></div>
            <p class="subtitle">Vocal Studio</p>

            <a href="booking.html" class="cta-button">Перейти до запису</a>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🎤</div>
                    <h3>Професійні уроки</h3>
                    <p>Навчання вокалу від досвідченого педагога</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">📅</div>
                    <h3>Зручне розписання</h3>
                    <p>Обирай дату та час, зручний для тебе</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">✨</div>
                    <h3>Розвиток таланту</h3>
                    <p>Розкрий свій потенціал разом з DreamVoice!</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
